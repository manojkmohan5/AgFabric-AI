name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; runs on main queue instead, so a newer
  # push never kills a deploy halfway through.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: agfabric
          POSTGRES_PASSWORD: agfabric
          POSTGRES_DB: agfabric
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U agfabric"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      qdrant:
        image: qdrant/qdrant:latest
        ports: ["6333:6333"]

    env:
      # CI-only signing key. Real secrets go in repository secrets, never here.
      JWT_SECRET: ci-only-secret-key-at-least-32-characters-long
      DATABASE_URL: postgresql+psycopg://agfabric:agfabric@localhost:5432/agfabric
      SEED_PASSWORD: ci-test-password
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: agfabric
      S3_SECRET_KEY: agfabric-dev
      S3_BUCKET: agfabric-ci
      QDRANT_URL: http://localhost:6333
      # No OPENAI_API_KEY on purpose. Pinned to the fake provider so CI costs
      # nothing, works on forks, and gives deterministic ranking assertions.
      EMBEDDING_PROVIDER: fake
      LLM_PROVIDER: fake
      # Agents are triggered explicitly by the tests; a background timer would
      # race the assertions.
      ENABLE_SCHEDULER: "false"
      RUN_AGENTS_ON_STARTUP: "false"
      # CI-only webhook signing key, so the signature checks can run.
      WEBHOOK_SECRET: ci-only-webhook-secret
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      # Not a service container: minio/minio needs a `server /data` command, and
      # GitHub Actions services cannot pass one. Same invocation used locally.
      - name: Start MinIO
        working-directory: .
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=agfabric \
            -e MINIO_ROOT_PASSWORD=agfabric-dev \
            minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not become ready"; docker logs minio; exit 1

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Unit checks (no database)
        run: python selfcheck.py

      - name: Migrations apply and are reversible
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # Fails if a model changed without a matching migration.
      - name: Migrations match the models
        run: alembic check

      # The seed drops every table, so it refuses to run without this explicit
      # confirmation. Setting it here is safe and correct: the database is an
      # ephemeral service container created for this job and discarded with it.
      - name: Seed database
        run: python -m app.seed
        env:
          ALLOW_DESTRUCTIVE_SEED: "true"

      - name: Smoke test API
        run: python smoketest.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Catches Dockerfile and compose rot without needing a registry.
      - name: Validate compose file
        working-directory: .
        run: docker compose config --quiet

      - name: Build API image
        run: docker build -t agfabric-api .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # next build type-checks as well, so this catches type errors too.
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://agfabric-api.onrender.com

  # ------------------------------------------------------------------ deploy
  # Only pushes to main deploy, and only after every check above passed. The
  # backend goes first so the new frontend never calls an API that lacks it.

  deploy-backend:
    needs: [backend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://agfabric-api.onrender.com
    defaults:
      run:
        working-directory: .
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-dbgdm4e1egvs738ed7ng
    steps:
      # Deploys this exact commit (auto-deploy is off on Render) and waits for
      # the health check to pass, so a failed deploy fails this job.
      - name: Deploy to Render
        run: |
          test -n "$RENDER_API_KEY" || { echo "::error::Add the RENDER_API_KEY repository secret"; exit 1; }
          api="https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"
          auth="Authorization: Bearer $RENDER_API_KEY"
          id=$(curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            -d "{\"commitId\": \"$GITHUB_SHA\"}" "$api" | jq -r .id)
          echo "Render deploy $id for $GITHUB_SHA"
          for _ in $(seq 1 90); do
            status=$(curl -fsS -H "$auth" "$api/$id" | jq -r .status)
            case "$status" in
              live) echo "Live."; exit 0 ;;
              *failed|canceled|deactivated)
                echo "::error::Render deploy $id ended as $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Render deploy $id still $status after 15 minutes"; exit 1

  deploy-frontend:
    needs: [frontend, deploy-backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://agfabric.vercel.app
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_0bT4yh3FxNCE0PkEUhMee7hL
      VERCEL_PROJECT_ID: prj_HSpb3icgTpWl7lJiIY0lnzHu12Lh
    steps:
      - uses: actions/checkout@v4

      # Vercel's Hobby plan blocks a deployment whose git commit author is not
      # the account owner, and the CLI attaches that author whenever it runs
      # inside a git checkout. Without .git there is no author to block.
      - name: Detach from git
        working-directory: .
        run: rm -rf .git

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@65.4.0

      - name: Pull production settings
        run: |
          test -n "$VERCEL_TOKEN" || { echo "::error::Add the VERCEL_TOKEN repository secret"; exit 1; }
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
