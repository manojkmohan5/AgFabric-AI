global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: agfabric-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
    # If METRICS_TOKEN is set on the API, uncomment and match it:
    # authorization:
    #   type: Bearer
    #   credentials: <METRICS_TOKEN>
