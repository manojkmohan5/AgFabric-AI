[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: asserts are the point of selfcheck.py.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
# S608 flags SQL-shaped f-strings. In sqlgen.py the flagged strings are the LLM
# prompt (interpolating only the SCHEMA constant) and the LIMIT clause appended
# from an int setting. No user input reaches either. The actual defence against
# generated SQL is validate() plus a Postgres READ ONLY transaction, both of
# which are covered by four dedicated groups in selfcheck.py.
"app/sqlgen.py" = ["S608"]
# benchmark.py interpolates table names from a hardcoded tuple and EXPLAINs the
# hardcoded QUERIES list. No user input reaches either, and it is a dev tool that
# is never served.
"benchmark.py" = ["S608"]
# Autogenerated by `alembic revision --autogenerate`. Reformatting them by hand is
# churn that reappears on the next migration, and the content is machine-derived
# from the models rather than written.
"migrations/versions/*" = ["E501"]
